# Cento Gradini — configurazione Apache (URL puliti + cartelle non pubbliche).
#
# Installata da deploy/00-bootstrap.sh (o da deploy/01-apache.sh) in
# /etc/apache2/conf-available/orangeroad.conf e abilitata con a2enconf. Non
# tocca i vhost apposta: su una macchina che ospita piu' siti quelli sono
# condivisi, e basta un HSTS di troppo per rompere i vicini.
#
# !! ATTENZIONE AL PERCORSO !!
# Se il DocumentRoot passa per un SYMLINK, Apache abbina i blocchi <Directory>
# sul percorso COL SYMLINK NON RISOLTO. Scrivere il percorso reale compila,
# supera il configtest, non da' nessun errore — e semplicemente non si applica
# mai. Il sintomo e' che la home funziona (ci pensa DirectoryIndex) mentre ogni
# altro indirizzo da' 404 di Apache, il che sembra un problema di instradamento
# dell'applicazione e non lo e'. Qui sotto va il percorso sotto DocumentRoot.

<Directory /var/www/html/orangeroad>
    AllowOverride None
    Options -Indexes +FollowSymLinks
    Require all granted

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /orangeroad/

        # I file veri (fogli di stile, script, immagini) si servono da soli.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </IfModule>
</Directory>

# Cartelle che non devono mai uscire dal server. Il criterio e' per suffisso di
# percorso e non per prefisso assoluto, sempre per la storia del symlink.
<DirectoryMatch "/orangeroad/(src|db|bin|config|deploy|docs|fonti|storage|tests|views)(/|$)">
    Require all denied
</DirectoryMatch>

# File sparsi che non vanno serviti: sorgenti, dump, diari, esempi di config.
<FilesMatch "(^\.|\.(md|sql|lock|log|dist|example|ini|tsv|sh)$)">
    Require all denied
</FilesMatch>
